<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mcx</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c0c0a; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .term {
        width: 1080px;
        height: 560px;
        background: #141412;
        color: #f7f7f4;
        font: 15px/1.45 ui-monospace, "SF Mono", Menlo, Monaco, "JetBrains Mono", monospace;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #2a2a26;
      }
      .body { flex: 1; padding: 18px 20px 8px; }
      .hero { display: flex; gap: 16px; align-items: flex-start; }
      .mark {
        color: #f7f7f4;
        white-space: pre;
        font-size: 15px;
        line-height: 1.15;
        letter-spacing: 0;
      }
      .meta { padding-top: 4px; }
      .name { color: #f54e00; font-weight: 700; }
      .ver { color: #807d72; }
      .tag { color: #a09c92; margin-top: 2px; }
      .prompt {
        margin-top: 36px;
        height: 22px;
        border-bottom: 1px solid #3a3a34;
        display: flex;
        align-items: center;
      }
      .caret {
        width: 8px;
        height: 16px;
        background: #f7f7f4;
      }
      .foot {
        padding: 8px 20px 12px;
        color: #807d72;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .model { color: #a09c92; }
    </style>
  </head>
  <body>
    <div class="term">
      <div class="body">
        <div class="hero">
          <div class="mark"> ▄███████████▄
█████████████▀
███████▀██▀▀
 ▀▀▀▀█  ▄▄▄▄▄▄
  ▄▄██████████
▄█████████████
▀███████████▀</div>
          <div class="meta">
            <div><span class="name">metacodex-cli</span><span class="ver"> 0.0.1</span></div>
            <div class="tag">one session, several wallets</div>
          </div>
        </div>
        <div class="prompt"><span class="caret"></span></div>
      </div>
      <div class="foot">
        <span>~/project</span>
        <span>0.0%/1.0M (auto)</span>
        <span class="model">deepseek-v4-pro · high</span>
      </div>
    </div>
  </body>
</html>
